<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ひとこと掲示板</title>
  <style>
    body { font-family: "Meiryo", "Hiragino Sans", sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #1f2937; background: #f8fafc; }
    h1 { color: #1e3a5f; font-size: 1.8rem; margin-bottom: .2rem; }
    .lead { color: #64748b; margin-top: 0; }
    form { display: flex; gap: .5rem; margin: 1.2rem 0; }
    input[type=text] { flex: 1; padding: .6rem; font-size: 1rem; border: 1px solid #cbd5e1; border-radius: 6px; }
    button { padding: .6rem 1.2rem; font-size: 1rem; background: #0f766e; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: .7rem 1rem; margin-bottom: .5rem; }
    .time { color: #94a3b8; font-size: .8rem; margin-left: .5rem; }
    .banner { padding: .6rem 1rem; border-radius: 6px; font-size: .9rem; }
    .memory { background: #fef3c7; color: #92400e; }
    .db { background: #dcfce7; color: #166534; }
    .error { background: #fee2e2; color: #991b1b; }
    footer { color: #94a3b8; font-size: .8rem; text-align: right; margin-top: 2rem; }
  </style>
</head>
<body>
{% block body %}{% endblock %}
<footer>hitokoto 2.0</footer>
</body>
</html>
